name: refresh feed

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python3 scripts/diag_feed.py   # TEMPORARY route diagnostics, remove with scripts/diag_feed.py
      - run: python3 scripts/fetch_feed.py
      - name: commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || git commit -m "refresh feed $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
